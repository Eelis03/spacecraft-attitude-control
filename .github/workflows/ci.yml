name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Measured at 99.07 per cent locally. The gate is two points below the
      # measurement rounded down, which leaves room for a platform difference in
      # a branch or two without leaving room for a test to be deleted.
      - name: Run tests
        run: uv run pytest -q --cov=src/attitude_control --cov-report=term-missing --cov-fail-under=97

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy
