[project]
name = "spacecraft-attitude-control"
version = "0.1.0"
description = "Quaternion attitude dynamics with reaction wheel LQR and PD control and momentum dumping."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Emre Yilmaz" }]
keywords = ["spacecraft", "attitude-control", "quaternion", "lqr", "python"]
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attitude_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: excluded from the default run"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/attitude_control", "tests", "examples"]

# SciPy ships no type information for the LAPACK wrappers used by the LQR design.
# The single call site annotates the result explicitly, so nothing is lost.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
